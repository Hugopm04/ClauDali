# Suffixes that reliably mean "a person who does a thing". Length-guarded,
# because -ist also ends "mist", "twist" and "fist". Kept short on purpose: a
# clever suffix rule is how "flower" and "water" become people.
person_suffixes:
  - smith
  - keeper
  - wright
  - woman
  - women

# Words that mean more than one, so a single-body crop cannot contain them.
plural_words:
  - couple
  - crowd
  - dozens
  - flock
  - group
  - many
  - multiple
  - pair
  - several
  - swarm
  - three
  - trio
  - two
